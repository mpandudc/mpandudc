<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Grid -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#172033" stroke-width="0.7"/>
    </pattern>
    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="#090d16"/>
  <rect width="1000" height="580" fill="url(#grid)"/>

  <!-- TITLE BAR -->
  <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">HYBRID DATA PLATFORM &amp; AUTONOMOUS SYSTEMS ARCHITECTURE</text>
  <text x="30" y="56" fill="#64748b" font-size="11">Dual Ingestion (Streaming + Batching) • Lakehouse Engine • Multi-Agent Autonomous Hub</text>

  <!-- ================= CONTAINERS ================= -->
  <!-- 1. INGRESS & STREAMING BUS (Orange theme) -->
  <rect x="30" y="80" width="220" height="420" rx="10" fill="#111726" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="42" y="92" width="196" height="24" rx="4" fill="#1c1917"/>
  <text x="50" y="108" fill="#fb923c" font-size="11" font-weight="700">1. INGESTION &amp; EVENT BUS</text>

  <!-- Redpanda -->
  <g transform="translate(45, 130)">
    <rect width="190" height="60" rx="6" fill="#1e1512" stroke="#ea580c" stroke-width="1.2"/>
    <text x="14" y="24" fill="#fdba74" font-size="12" font-weight="700">Redpanda</text>
    <text x="14" y="42" fill="#9a3412" font-size="10">Kafka-API Event Streaming</text>
  </g>

  <!-- Airflow -->
  <g transform="translate(45, 205)">
    <rect width="190" height="60" rx="6" fill="#121b24" stroke="#0284c7" stroke-width="1.2"/>
    <text x="14" y="24" fill="#7dd3fc" font-size="12" font-weight="700">Apache Airflow</text>
    <text x="14" y="42" fill="#0369a1" font-size="10">Batch Orchestrator &amp; DAGs</text>
  </g>

  <!-- Ingress Sources -->
  <g transform="translate(45, 280)">
    <rect width="190" height="95" rx="6" fill="#151b28" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#cbd5e1" font-size="11" font-weight="600">Event Ingress Sources</text>
    <text x="14" y="42" fill="#64748b" font-size="10">• Exchange Tickers &amp; Orderbook</text>
    <text x="14" y="60" fill="#64748b" font-size="10">• Transactional CDC Streams</text>
    <text x="14" y="78" fill="#64748b" font-size="10">• App Logs &amp; Metric Traces</text>
  </g>

  <!-- Local MinIO Object Lake -->
  <g transform="translate(45, 390)">
    <rect width="190" height="60" rx="6" fill="#19131d" stroke="#c026d3" stroke-width="1.2"/>
    <text x="14" y="24" fill="#f0abfc" font-size="12" font-weight="700">MinIO (Local Lake)</text>
    <text x="14" y="42" fill="#a21caf" font-size="10">S3-Compatible Object Store</text>
  </g>

  <!-- 2. COMPUTE & LAKEHOUSE (Cyan/Emerald theme) -->
  <rect x="275" y="80" width="220" height="420" rx="10" fill="#111726" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="287" y="92" width="196" height="24" rx="4" fill="#082f49"/>
  <text x="295" y="108" fill="#38bdf8" font-size="11" font-weight="700">2. PROCESSING ENGINES</text>

  <!-- Apache Flink -->
  <g transform="translate(290, 130)">
    <rect width="190" height="60" rx="6" fill="#0c1e28" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="14" y="24" fill="#67e8f9" font-size="12" font-weight="700">Apache Flink</text>
    <text x="14" y="42" fill="#0891b2" font-size="10">Low-Latency Event Stream</text>
  </g>

  <!-- Apache Spark -->
  <g transform="translate(290, 205)">
    <rect width="190" height="60" rx="6" fill="#1b1712" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="14" y="24" fill="#fcd34d" font-size="12" font-weight="700">Apache Spark</text>
    <text x="14" y="42" fill="#d97706" font-size="10">Distributed Batch &amp; ML</text>
  </g>

  <!-- Databricks Lakehouse -->
  <g transform="translate(290, 280)">
    <rect width="190" height="60" rx="6" fill="#1e1014" stroke="#e11d48" stroke-width="1.2"/>
    <text x="14" y="24" fill="#fda4af" font-size="12" font-weight="700">Databricks</text>
    <text x="14" y="42" fill="#be123c" font-size="10">Unified Lakehouse Compute</text>
  </g>

  <!-- Snowflake Warehouse -->
  <g transform="translate(290, 355)">
    <rect width="190" height="60" rx="6" fill="#0d1b2a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="24" fill="#bae6fd" font-size="12" font-weight="700">Snowflake</text>
    <text x="14" y="42" fill="#0284c7" font-size="10">Cloud Analytics Warehouse</text>
  </g>

  <!-- Metabase BI -->
  <g transform="translate(290, 425)">
    <rect width="190" height="60" rx="6" fill="#081e28" stroke="#10b981" stroke-width="1.2"/>
    <text x="14" y="24" fill="#6ee7b7" font-size="12" font-weight="700">Metabase BI</text>
    <text x="14" y="42" fill="#059669" font-size="10">Executive Dashboards &amp; KPIs</text>
  </g>


  <!-- 3. AUTONOMOUS AGENTS & SECOND BRAIN (Purple theme) -->
  <rect x="520" y="80" width="220" height="420" rx="10" fill="#111726" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="532" y="92" width="196" height="24" rx="4" fill="#2e1065"/>
  <text x="540" y="108" fill="#c084fc" font-size="11" font-weight="700">3. AI &amp; SECOND BRAIN</text>

  <!-- Multi-Agent Core -->
  <g transform="translate(535, 130)">
    <rect width="190" height="65" rx="6" fill="#1a1128" stroke="#a855f7" stroke-width="1.2"/>
    <text x="14" y="24" fill="#e9d5ff" font-size="12" font-weight="700">Hermes Multi-Agent</text>
    <text x="14" y="42" fill="#9333ea" font-size="10">Knowledge, SRE &amp; Quant Ops</text>
    <text x="14" y="55" fill="#6b21a8" font-size="9">Autonomous Goal Loops</text>
  </g>

  <!-- vault-mcp -->
  <g transform="translate(535, 210)">
    <rect width="190" height="65" rx="6" fill="#131e2b" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="14" y="24" fill="#bfdbfe" font-size="12" font-weight="700">vault-mcp (FastMCP)</text>
    <text x="14" y="42" fill="#2563eb" font-size="10">Two-Tier Hybrid RAG</text>
    <text x="14" y="55" fill="#1d4ed8" font-size="9">BM25 + BGE-M3 + Jina Rerank</text>
  </g>

  <!-- notebooklm-fastmcp -->
  <g transform="translate(535, 290)">
    <rect width="190" height="65" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="1.2"/>
    <text x="14" y="24" fill="#fed7aa" font-size="12" font-weight="700">notebooklm-fastmcp</text>
    <text x="14" y="42" fill="#ea580c" font-size="10">Long-Context Document Bypass</text>
    <text x="14" y="55" fill="#9a3412" font-size="9">Master Token + 1-Shot Podcast</text>
  </g>

  <!-- Knowledge Stores -->
  <g transform="translate(535, 375)">
    <rect width="190" height="110" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="11" font-weight="600">Storage &amp; Grounding</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10">• Obsidian Vault (Markdown)</text>
    <text x="14" y="60" fill="#94a3b8" font-size="10">• Google NotebookLM (2M ctx)</text>
    <text x="14" y="78" fill="#94a3b8" font-size="10">• SQLite &amp; FAISS / Vector DB</text>
    <text x="14" y="96" fill="#94a3b8" font-size="10">• Direct Disk Artifact Sync</text>
  </g>


  <!-- 4. QUANT TRADING & APPS (Emerald/Cyan theme) -->
  <rect x="765" y="80" width="205" height="420" rx="10" fill="#111726" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="777" y="92" width="181" height="24" rx="4" fill="#064e3b"/>
  <text x="785" y="108" fill="#6ee7b7" font-size="11" font-weight="700">4. PRODUCTION APPS</text>

  <!-- cuantum -->
  <g transform="translate(775, 130)">
    <rect width="185" height="75" rx="6" fill="#06221d" stroke="#10b981" stroke-width="1.2"/>
    <text x="14" y="24" fill="#a7f3d0" font-size="12" font-weight="700">cuantum (Private)</text>
    <text x="14" y="42" fill="#059669" font-size="10">Algo Trading &amp; Execution</text>
    <text x="14" y="58" fill="#047857" font-size="9">Binance/Bitget CCXT Engine</text>
  </g>

  <!-- duwit -->
  <g transform="translate(775, 220)">
    <rect width="185" height="70" rx="6" fill="#0f1e2e" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="24" fill="#bae6fd" font-size="12" font-weight="700">duwit (Open Source)</text>
    <text x="14" y="42" fill="#0284c7" font-size="10">Financial Analytics Suite</text>
    <text x="14" y="56" fill="#0369a1" font-size="9">Next.js + Drizzle + Reconciliation</text>
  </g>

  <!-- Infrastructure & Gateways -->
  <g transform="translate(775, 305)">
    <rect width="185" height="180" rx="6" fill="#0d1525" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="11" font-weight="600">Edge &amp; Ingress Layer</text>
    <text x="14" y="44" fill="#94a3b8" font-size="10">• Cloudflare Zero Trust Tunnel</text>
    <text x="14" y="64" fill="#94a3b8" font-size="10">• Tailscale Private Mesh</text>
    <text x="14" y="84" fill="#94a3b8" font-size="10">• AdGuard Home Private DNS</text>
    <text x="14" y="104" fill="#94a3b8" font-size="10">• PostgreSQL 16 Ledger</text>
    <text x="14" y="124" fill="#94a3b8" font-size="10">• Redis 7 Orderbook Cache</text>
    <text x="14" y="144" fill="#94a3b8" font-size="10">• n8n Webhook Automations</text>
  </g>

  <!-- ================= CONNECTORS / ARROWS ================= -->
  <!-- Redpanda to Flink -->
  <path d="M 235 160 L 290 160" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)" fill="none"/>
  
  <!-- Ingress to Redpanda -->
  <path d="M 140 280 L 140 195" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-orange)" fill="none"/>

  <!-- Airflow to Spark & Databricks -->
  <path d="M 235 235 L 290 235" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cyan)" fill="none"/>
  <path d="M 235 250 L 265 250 L 265 310 L 290 310" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-cyan)" fill="none"/>

  <!-- Spark/Databricks to Snowflake/MinIO -->
  <path d="M 385 340 L 385 355" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)" fill="none"/>
  <path d="M 290 255 L 250 255 L 250 420 L 235 420" stroke="#c026d3" stroke-width="1.5" marker-end="url(#arrow-cyan)" fill="none"/>

  <!-- Snowflake to Metabase -->
  <path d="M 385 415 L 385 425" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)" fill="none"/>

  <!-- Flink to cuantum -->
  <path d="M 480 160 L 775 160" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-cyan)" fill="none"/>

  <!-- AI Agents to MCPs -->
  <path d="M 630 195 L 630 210" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)" fill="none"/>
  <path d="M 630 275 L 630 290" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)" fill="none"/>
  <path d="M 630 355 L 630 375" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)" fill="none"/>

  <!-- FOOTER BAR -->
  <text x="30" y="540" fill="#475569" font-size="11">Architecture Overview: Scalable Stream-First Real-Time Processing &amp; Analytical Lakehouse with Autonomous Agent Feedback Loops.</text>
</svg>